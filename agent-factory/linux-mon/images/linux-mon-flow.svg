<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" role="img" aria-labelledby="title desc"><title id="title">Linux Monitoring</title><desc id="desc">Chat input supplies a prompt to the Agent. Evidence tools connect to the Agent. The Agent sends its message to Chat output.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#357b70"/></marker></defs><rect width="1040" height="400" rx="12" fill="#f7f8f6"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="23" fill="#243b42">Linux Monitoring</text><rect x="30" y="245" width="250" height="84" rx="10" fill="#fff" stroke="#71858b"/><text x="155" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b42">Chat input</text><text x="155" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#52666d">An ordinary user question</text><rect x="395" y="245" width="250" height="84" rx="10" fill="#e4f1ed" stroke="#71858b"/><text x="520" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b42">Agent</text><text x="520" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#52666d">Select evidence and explain</text><rect x="760" y="245" width="250" height="84" rx="10" fill="#fff" stroke="#71858b"/><text x="885" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b42">Chat output</text><text x="885" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#52666d">Findings, scope and next check</text><rect x="395" y="85" width="250" height="84" rx="10" fill="#fff" stroke="#71858b"/><text x="520" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b42">MCP server</text><text x="520" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#52666d">Six read-only monitoring tools</text><path d="M280,287 H385" fill="none" stroke="#357b70" stroke-width="3" marker-end="url(#arrow)"/><text x="332" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#357b70">Prompt</text><path d="M645,287 H750" fill="none" stroke="#357b70" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#357b70">Message</text><path d="M520,169 V235" fill="none" stroke="#357b70" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#357b70">Tools</text></svg>